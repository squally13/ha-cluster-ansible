# Konfiguracja Ansible dla labu — uruchamiaj z /vagrant na ops jako admin
[defaults]
inventory = inventories/lab/hosts.yml
roles_path = roles
remote_user = admin
private_key_file = ~/.ssh/id_ed25519
# Lab jest odtwarzany od zera: po każdym `vagrant destroy` klucze hostów są nowe,
# więc sprawdzanie kluczy hostów dawałoby tylko fałszywe alarmy. Na produkcji: True.
host_key_checking = False
interpreter_python = /usr/bin/python3
stdout_callback = default
callback_result_format = yaml

[ssh_connection]
pipelining = True
