---
# Jedyne źródło listy maszyn labu (R3) — czyta je także Vagrantfile.
# Reguły (data-model.md):
#   - nazwa hosta: ^[a-z][a-z0-9]*$, unikalna
#   - ansible_host: unikalny, w 192.168.56.0/24; różny od VIP (.10) i hosta (.1)
#   - każdy host należy do dokładnie jednej z grup: ops, lb, web, db
#   - vagrant_memory: RAM maszyny w MB (> 0)
all:
  children:
    ops:
      hosts:
        ops:
          ansible_host: 192.168.56.5
          vagrant_memory: 1024
    lb:
      hosts:
        lb1:
          ansible_host: 192.168.56.11
          vagrant_memory: 512
        lb2:
          ansible_host: 192.168.56.12
          vagrant_memory: 512
    web:
      hosts:
        web1:
          ansible_host: 192.168.56.21
          vagrant_memory: 1024
        web2:
          ansible_host: 192.168.56.22
          vagrant_memory: 1024
    db:
      hosts:
        db1:
          ansible_host: 192.168.56.31
          vagrant_memory: 1536
        db2:
          ansible_host: 192.168.56.32
          vagrant_memory: 1536
