---
- name: Skonfiguruj źródła automatycznych aktualizacji (tylko bezpieczeństwo)
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Włącz okresowe aktualizacje APT
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Ustaw needrestart w trybie tylko-listy (bez restartów)
  ansible.builtin.template:
    src: needrestart.conf.j2
    dest: /etc/needrestart/conf.d/50-ha-homelab.conf
    owner: root
    group: root
    mode: "0644"

# Obraz Bento maskuje usługi apt-daily (unika blokad apt przy budowie obrazu) — bez tego
# timery nie startują, a poprawki bezpieczeństwa nigdy by się nie instalowały.
- name: Odmaskuj usługi okresowych aktualizacji APT
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: false
  loop:
    - apt-daily.service
    - apt-daily-upgrade.service

- name: Włącz timery aktualizacji APT
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
