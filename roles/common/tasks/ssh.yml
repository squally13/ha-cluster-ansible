---
- name: Wygeneruj konfigurację serwera SSH
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: restart ssh

- name: Włącz i uruchom serwer SSH
  ansible.builtin.service:
    name: ssh
    enabled: true
    state: started
